# Loaded by the bundled Unbound resolver (docker-compose.yml) on top of the
# image's defaults: a recursive, DNSSEC-validating resolver for the Docker
# network only. AbuseBox sends its blacklist lookups here, so they leave from
# this server's own IP instead of a public resolver that Spamhaus and others
# refuse. 127.0.0.0/8 is deliberately not a private-address: blacklists answer
# with 127.0.0.x, and dropping those answers would hide every listing.
server:
    # Docker networks usually have no IPv6 route; skip it instead of timing out.
    do-ip6: no
