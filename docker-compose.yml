services:
  backend:
    image: ghcr.io/${GHCR_REPO:-bekkaze/abusebox}-backend:latest
    build: ./backend
    env_file:
      - path: .env
        required: false
    # Values below use ${VAR:-default} so anything set in .env takes effect.
    # (Plain literals here would silently override .env.)
    # APP_SECRET_KEY: leave unset to auto-generate one, stored in the data volume.
    environment:
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_SECRET_KEY=${APP_SECRET_KEY:-}
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Fixed on purpose: the database must live in the persistent volume
      # (a DATABASE_URL copied from .env.example would point outside it).
      - DATABASE_URL=sqlite:////app/data/app.db
      - DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME:-admin}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@abusebox.local}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-password123}
      - DEFAULT_ADMIN_PHONE=${DEFAULT_ADMIN_PHONE:-11111111}
    volumes:
      - abusebox-data:/app/data
    ports:
      - 8100:8100
  frontend:
    image: ghcr.io/${GHCR_REPO:-bekkaze/abusebox}-frontend:latest
    build: ./frontend
    depends_on:
      - backend
    environment:
      - VITE_BASE_URL=http://backend:8100
      - VITE_API_DOCS_URL=${VITE_API_DOCS_URL:-http://localhost:8100/swagger/}
      # Hostnames the dev server will answer to. Add your server's domain/IP here
      # (or in .env) when accessing AbuseBox from another machine.
      - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports:
      - 3000:3000

volumes:
  abusebox-data:
