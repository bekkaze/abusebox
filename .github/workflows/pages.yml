name: Project site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "files/*.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Screenshots live in files/ for the README; copy them in rather than
      # keeping a second set in the repository.
      - name: Add screenshots
        run: mkdir -p site/screens && cp files/dashboard.png files/dashboard_dark.png files/asset_details.png site/screens/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
