name: Feature request
description: Suggest an idea or a new check
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, e.g. "I run a mail server and need to know when...".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like AbuseBox to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
      description: Other tools, scripts or manual steps you use instead.
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'd like to work on this myself
