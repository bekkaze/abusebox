<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The favicon is a tile rather than the bare mark: tab bars run from
         white to near-black, and the bare mark's dark inner cube sinks into
         the dark ones until it reads as a hollow ring. SVG first so it stays
         sharp at any size; the PNG is the fallback, and doubles as the iOS
         home-screen icon, which wants an opaque square anyway. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="180x180" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Self-hosted threat monitoring for IPs and domains: DNS blacklists, AbuseIPDB, DNS, SSL, WHOIS, SPF/DKIM/DMARC and uptime checks." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16191e" media="(prefers-color-scheme: dark)" />
    <title>AbuseBox</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
