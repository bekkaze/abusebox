[tool.poetry]
name = "backend"
version = "1.1.3"
description = "AbuseBox FastAPI backend"
authors = ["bekkaze <bekkaze7@gmail.com>"]
readme = "README.md"

# Keep in sync with requirements.txt (the Docker image installs from that file).
[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.142.2"
starlette = "^1.7.0"
uvicorn = {extras = ["standard"], version = "^0.54.0"}
sqlalchemy = "^2.0.54"
pydantic = "^2.13.5"
passlib = "^1.7.4"
pyjwt = "^2.15.1"
requests = "^2.34.2"
dnspython = "^2.8.0"
python-multipart = "^0.0.32"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-timeout = "^2.4.0"
httpx = "^0.28.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
